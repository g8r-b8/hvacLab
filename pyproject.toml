[project]
name = "hvaclab"
version = "0.1.0"
description = "Vendor-neutral read-first frontend/backend for commercial HVAC building automation systems (BACnet/Haystack)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Wingate Jones" }]
keywords = ["bacnet", "hvac", "haystack", "brick", "ashrae-223p", "bas"]

dependencies = [
    "bacpypes3>=0.0.98",
    "pymodbus>=3.6",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "duckdb>=1.0",
]

[project.optional-dependencies]
rdf = ["rdflib>=7.0"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hvaclab = "hvaclab.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hvaclab"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/hvaclab"]
disallow_untyped_defs = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
